<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SPGrid basic example</title>
    <style>
      body {
        font-family: 'Sarabun', sans-serif;
        --spg-font-family: 'Sarabun', sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Three rows, sortable + searchable with a column select, no pagination. Used by the smoke/sort/filter e2e tests. -->
    <div id="grid"></div>
    <script type="module">
      import { SPGrid } from '/src/index.js';

      new SPGrid(document.getElementById('grid'), {
        columns: [
          { key: 'id', label: 'ID', sortable: true },
          { key: 'name', label: 'Name', sortable: true },
          { key: 'role', label: 'Role', sortable: true },
        ],
        searchable: true,
        searchColumnSelect: true,
        bordered: true,
        rows: [
          { id: 1, name: 'Ada', role: 'Engineer' },
          { id: 2, name: 'Grace', role: 'Admiral' },
          { id: 3, name: '<b>Eve</b>', role: 'Tester' },
        ],
      });
    </script>
  </body>
</html>
