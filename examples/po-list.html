<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ตัวอย่าง SPGrid: รายการใบสั่งซื้อ (PO List)</title>
    <link rel="stylesheet" href="/examples/dialogs.css" />
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        background: #fff;
        font-family: 'Sarabun', sans-serif;
        --spg-font-family: 'Sarabun', sans-serif;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
      }
      /* The table is wider than the container. The grid's wrapper clips by default (overflow: clip),
         so this example turns that into horizontal scrolling; the pager stays put. */
      #grid .spg-table-wrap {
        overflow-x: auto;
      }
      #grid .spg-table {
        min-width: 2050px;
      }
      #log {
        min-height: 1.5em;
        margin: 12px 0 0;
        font-size: 13px;
      }
      #source {
        margin-top: 32px;
      }
      .source-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .source-head h2 {
        margin: 0;
        font-size: 1.1rem;
      }
      .source-head button {
        padding: 4px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #source pre {
        max-height: 28rem;
        margin: 12px 0 0;
        padding: 16px;
        overflow: auto;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="grid"></div>
      <pre id="log" role="status" aria-live="polite"></pre>
      <section id="source" aria-labelledby="source-title">
        <div class="source-head">
          <h2 id="source-title">Source Code</h2>
          <button type="button">คัดลอก</button>
        </div>
        <pre tabindex="0"><code></code></pre>
      </section>
    </main>
    <script type="module" src="/examples/po-list.js"></script>
    <script type="module" src="/examples/source-viewer.js"></script>
  </body>
</html>
