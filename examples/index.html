<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DataGrid example</title>
    <style>
      /* Page chrome for the demo only; the grid themes itself. */
      body {
        margin: 0;
        padding: 24px 16px;
        background: #f3f4f6;
        color: #111827;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body:not([data-page-theme='light']) {
          background: #0b1220;
          color: #e5e7eb;
        }
      }
      main {
        display: grid;
        gap: 40px;
        max-width: 880px;
        margin: 0 auto;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 600;
      }
      .panel-dark {
        padding: 16px;
        border-radius: 12px;
        background: #0b1220;
        color: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/examples/procurement.html">ตัวอย่าง: PO List (procurement)</a></p>
      <section>
        <h2>ค่าเริ่มต้น</h2>
        <div id="grid-default"></div>
      </section>
      <section>
        <h2>แบบกะทัดรัด + แถวสลับสี</h2>
        <div id="grid-compact"></div>
      </section>
      <section>
        <h2>หัวตารางค้าง, maxHeight 240</h2>
        <div id="grid-sticky"></div>
      </section>
      <section class="panel-dark" data-theme="dark">
        <h2>โหมดมืด (data-theme="dark")</h2>
        <div id="grid-dark"></div>
      </section>
    </main>
    <script type="module">
      import { DataGrid, thaiLabels } from '/src/index.js';

      const roles = ['Engineer', 'Admiral', 'Tester'];
      // 25 rows: ids 1-3 are fixed (one name needs escaping); the rest are generated.
      const rows = [
        { id: 1, name: 'Ada', role: 'Engineer' },
        { id: 2, name: 'Grace', role: 'Admiral' },
        { id: 3, name: '<b>Eve</b>', role: 'Tester' },
        ...Array.from({ length: 22 }, (_, i) => ({
          id: i + 4,
          name: `User ${i + 4}`,
          role: roles[(i + 3) % roles.length],
        })),
      ];
      const columns = [
        { key: 'id', label: 'ID', sortable: true, align: 'right' },
        { key: 'name', label: 'Name', sortable: true },
        { key: 'role', label: 'Role', sortable: true },
      ];
      const pager = { pageSize: 5, pageSizeOptions: [5, 10, 25], labels: thaiLabels };
      const grid = (id) => document.getElementById(id);

      new DataGrid(grid('grid-default'), { columns, rows, searchable: true, ...pager });
      new DataGrid(grid('grid-compact'), {
        columns,
        rows,
        searchable: true,
        density: 'compact',
        striped: true,
        ...pager,
      });
      new DataGrid(grid('grid-sticky'), {
        columns,
        rows,
        stickyHeader: true,
        maxHeight: 240,
        labels: thaiLabels,
      });
      new DataGrid(grid('grid-dark'), { columns, rows, searchable: true, striped: true, ...pager });
    </script>
  </body>
</html>
