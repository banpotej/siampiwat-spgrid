<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ตัวอย่าง DataGrid: รายการใบสั่งซื้อ (PO List)</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        background: #f3f4f6;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        font-size: 13px;
        color: #4b5563;
      }
      /* The table is wider than the container. The grid's wrapper clips by default (overflow: clip),
         so this example turns that into horizontal scrolling; the pager stays put. */
      #grid .dg-table-wrap {
        overflow-x: auto;
      }
      #grid .dg-table {
        min-width: 2050px;
      }
      /* Action buttons: View keeps the grid's accent colour, Cancel is red. */
      .btn-cancel {
        --dg-action-bg: #b91c1c;
      }
      #log {
        min-height: 1.5em;
        margin: 12px 0 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PO List</h1>
      <p>
        ข้อมูลจำลองทั้งหมด มีปุ่ม View และ Cancel (เฉพาะรายการที่ยกเลิกได้) จากคอลัมน์
        <code>actions</code> ผลการกดจะแสดงใต้ตาราง ส่วนลิงก์เลขที่ใบสั่งซื้อและป้ายสถานะจะเพิ่มด้วย
        <code>column.render</code>
        ในขั้นถัดไป
      </p>
      <div id="grid"></div>
      <pre id="log" role="status" aria-live="polite"></pre>
    </main>
    <script type="module">
      import { DataGrid, thaiLabels } from '/src/index.js';
      import { createPurchaseOrders } from '/examples/mock/purchaseOrders.js';

      const pad = (n) => String(n).padStart(2, '0');
      // Cells cannot be rendered yet, so the date is shown as yyyy-MM-dd (sorts chronologically as text).
      const iso = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
      const rows = createPurchaseOrders().map((po) => ({
        ...po,
        submittedDate: iso(po.submittedDate),
        deliveryDate: iso(po.deliveryDate),
        deliveryComplete: po.deliveryComplete ? '✓' : '–',
        rfqNumber: po.rfqNumber || null,
        recipient: po.recipient || null,
        claimer: po.claimer || null,
        cancelBy: po.cancelBy || null,
      }));

      const log = document.getElementById('log');
      const grid = new DataGrid(document.getElementById('grid'), {
        rowKey: 'id',
        onAction: ({ action, row }) => {
          if (action === 'cancel' && !window.confirm(`ยกเลิก ${row.poNumber}?`)) return;
          log.textContent = `${action} ${row.poNumber}`; // textContent: never parsed as HTML
        },
        columns: [
          { key: '_view', ariaLabel: 'ดู', actions: [{ name: 'view', label: 'View' }] },
          {
            key: '_cancel',
            ariaLabel: 'ยกเลิก',
            actions: [
              {
                name: 'cancel',
                label: 'Cancel',
                className: 'btn-cancel',
                visible: (r) => r.canCancel,
              },
            ],
          },
          { key: 'rfqNumber', label: 'เลขที่เอกสาร RFQ\nRFQ Number', sortable: true },
          { key: 'poNumber', label: 'เลขที่ใบสั่งซื้อ\nPO Number', sortable: true },
          { key: 'submittedDate', label: 'วันที่จัดส่งเอกสาร\nSubmitted Date', sortable: true },
          { key: 'purchasingType', label: 'ประเภทจัดซื้อ\nPurchasing Type', sortable: true },
          { key: 'status', label: 'สถานะ\nStatus', sortable: true },
          { key: 'vendor', label: 'ชื่อผู้ค้า\nVendor', sortable: true },
          { key: 'creator', label: 'ผู้สร้างเอกสาร\nCreator Name', sortable: true },
          { key: 'deliveryDate', label: 'วันที่กำหนดส่งสินค้า\nDelivery Date', sortable: true },
          { key: 'recipient', label: 'ผู้ตรวจรับ\nRecipient', sortable: true },
          { key: 'claimer', label: 'ผู้เคลมเอกสาร\nClaimer', sortable: true },
          { key: 'cancelBy', label: 'ผู้ยกเลิกเอกสาร\nCancel By', sortable: true },
          { key: 'companyCode', label: 'รหัสบริษัท\nCompany Code', sortable: true },
          {
            key: 'deliveryComplete',
            label: 'ตรวจรับเสร็จสิ้น\nDelivery Complete',
            align: 'center',
          },
          { key: 'creationType', label: 'การสร้างเอกสาร', sortable: true },
        ],
        rows,
        searchable: true,
        searchDebounce: 50,
        pageSize: 10,
        pageSizeOptions: [10, 20, 50],
        striped: true,
        density: 'compact',
        labels: thaiLabels,
      });
      window.addEventListener('pagehide', () => grid.destroy(), { once: true });
    </script>
  </body>
</html>
