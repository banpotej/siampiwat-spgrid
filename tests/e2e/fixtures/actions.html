<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataGrid actions fixture</title>
  </head>
  <body>
    <!-- 25 rows (ids 1-25), pageSize 5, View/Cancel action columns and a link cell. Used by actions.spec.js. -->
    <div id="grid"></div>
    <pre id="log"></pre>
    <script type="module">
      import { DataGrid, escapeHtml } from '/src/index.js';

      const rows = Array.from({ length: 25 }, (_, i) => ({
        id: i + 1,
        name: `User ${i + 1}`,
        canCancel: (i + 1) % 3 === 0,
      }));
      const grid = new DataGrid(document.getElementById('grid'), {
        columns: [
          { key: '_view', ariaLabel: 'View', actions: [{ name: 'view', label: 'View' }] },
          {
            key: '_cancel',
            ariaLabel: 'Cancel',
            actions: [
              {
                name: 'cancel',
                label: 'Cancel',
                className: 'btn-cancel',
                visible: (r) => r.canCancel,
              },
            ],
          },
          { key: 'id', label: 'ID', sortable: true },
          {
            key: 'name',
            label: 'Name',
            sortable: true,
            render: (v) => `<a href="#" data-cell-action="open">${escapeHtml(v)}</a>`,
          },
        ],
        rows,
        rowKey: 'id',
        pageSize: 5,
        searchable: true,
        onAction: ({ action, row, rowKey }) => {
          document.getElementById('log').textContent = `${action} ${row.id} ${rowKey}`;
        },
      });
      grid.on('cellClick', ({ originalEvent }) => originalEvent.preventDefault());
    </script>
  </body>
</html>
